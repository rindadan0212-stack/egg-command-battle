<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ `viewport-fit=cover` が無いと `env(safe-area-inset-*)` が常に 0 になり、
         ノッチやホームバーの下に UI が潜り込む。安全域を使うなら必須。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Egg Command Battle</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥚%3C/text%3E%3C/svg%3E"
    />
    <!-- ⚠️ 外部依存。出荷前に self-host へ切り替える（課題.md に記載）。
         いま外すと見出しが別書体になり、モックと見比べられなくなる。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;900&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app"></main>
    <!-- 横持ちの電話でだけ出る。CSS が出し分ける（デスクトップの横長には出さない） -->
    <div class="rotate">
      <span class="mark"></span>
      <span>縦にしてください</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
