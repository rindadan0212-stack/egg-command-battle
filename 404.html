<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <!-- ⚠️ 拡大を止める。⭐ 遊びの画面は外枠の倍率で写すので、二重にずらさない -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>卵強奪バトル</title>
    <base href="/egg-command-battle/" />
    <link rel="stylesheet" href="stage.css" />
    <!-- ⭐ 骨組みエディタ（`/edit`）専用の意匠（`Pages/EditPage.razor.css`）。
         ⚠️ Blazor WASM は自動で足してくれない（hosted/server 版と違う）ので手で書く。 -->
    <link rel="stylesheet" href="EggCommand.Web.styles.css" />
    <style>
      /* ⭐ フォントは同梱。⚠️ CDN に頼らない ── 落ちると字送りが変わり、
         Unity で詰めた座標の前提が崩れる。 */
      /* ⚠️ 今は使わない（stage.css は PixelMplus10 を使う）が、戻せるように残す
         （ドット絵化計画 §6・2026-08-25）。 */
      @font-face {
        font-family: "Mochiy Pop One";
        src: url("fonts/MochiyPopOne-Regular.ttf") format("truetype");
        font-display: block;
      }
      /* 🔴 採用フォント（ドット絵化計画 §6・2026-08-25）。
         ⭐ PixelMplus10 は「10の倍数」の font-size でだけ、にじみが1画素も出ない
         （8〜200px 総当たりで確認済み）。 */
      @font-face {
        font-family: "PixelMplus10";
        src: url("fonts/PixelMplus10-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "PixelMplus10";
        src: url("fonts/PixelMplus10-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }
      #app { height: 100%; }
      .loading { position: fixed; inset: 0; display: grid; place-items: center;
                 color: #cfd6ea; font: 16px/1.6 system-ui, sans-serif; }
    </style>
</head>

<body>
    <div id="app"><div class="loading">読み込んでいます…</div></div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;
         background:#c0303f;color:#fff;padding:12px;font:14px system-ui">
        何かが壊れました。<a href="." class="reload" style="color:#fff">読み直す</a>
        <span class="dismiss" style="float:right;cursor:pointer">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- ⭐ 押しどころを拾う（字を組み立てて流し込むので @onclick が付けられない） -->
    <script src="tap.js"></script>
    <!-- ⭐ 保存の置き場（同期な localStorage ── 閉じる瞬間に間に合う） -->
    <script src="save.js"></script>
    <!-- ⭐ 盤の演出（⚠️ Blazor に描かせない ── 組み直すたびにやり直しになる） -->
    <script src="fx.js"></script>
    <!-- ⭐ すごろくの盤を巻く（⚠️ 組み直しで 0 へ戻るので、描くたびに寄せ直す） -->
    <script src="board.js"></script>
    <!-- ⭐ 骨組みエディタ（`/edit`）専用。⚠️ 遊ぶ頁（`/app`）は読み込むだけで使わない -->
    <script src="disk.js"></script>
    <script src="edit.js"></script>
    <script>
      // ⭐ **設計 1080x1920 を、外枠の拡大縮小だけで実機へ写す。**
      // ⚠️ 作者の決定（絶対座標のまま）の帰結。20:9 では上下に帯が出る（課題 §9-7）。
      //
      // 🔴 **整数倍だけで拡大し、余りは黒帯**（ドット絵化計画 §3・2026-08-25）。
      // ⚠️ 半端倍率（前は `min(innerWidth/1080, innerHeight/1920)`）だと、絵のドットが
      //    端末ごとにバラバラの太さになる（計画 §0 の実測 13通り）── 二度と使わない。
      //
      // 升目は 270x480 ドット（1ドット = 設計4px）。実ピクセルから
      // 「1ドットが実際に何pxか」= P を整数で決め、CSS 倍率 k = P / (4 * DPR) を掛ける。
      //
      // 🔴 **少しはみ出させる**（2026-08-29・作者の指示「画面いっぱいに表示」）。
      // ⚠️ 「必ず全部収める」だけだと、**実高 959px と 960px の境で盤が4倍変わる**
      //    （P=1 ⇄ 2）。1080p のモニタはブラウザの枠込みで実高 936〜955px に落ちるので、
      //    表示倍率 100%/125%/150% のどれでも下側に落ち、盤が縦半分（270x480）になる
      //    ── 実測 1920x950 で縦の埋まり **51%**・面積 7.1%。作者の言う「余白が多い」
      //    の正体はこれで、倍率が半端だったからではない。
      // ⭐ **切ってよい量は骨組みの空白から決める**（実測）:
      // 🔴 **上は切れない（0）**（2026-08-29 の見直し）。⚠️ 前は「`frame.txt` の
      //    `back`/`extra` 釦が y=12 から」を根拠に 12px 切っていたが、その上のバーを
      //    丸ごと外した（作者の指示「この帯は不要」）ので前提が消えた。
      //    ⭐ いま画面のてっぺんに来るのは**各画面の中身そのもの** ── ホームは
      //    `home.txt` の `count`（EXP の字）が **y=0 から**始まるので、1px でも切ると字が欠ける。
      // ⭐ 下 40px（タブ下端 1880）は変わらない ── 4px 残して 36px まで。
      // ⚠️ **左右は切らない。**横は縦横比の問題（9:16 を 16:9 の窓に置く）で、
      //    倍率をどういじっても余る ── 作者の判断で黒のままにしてある。
      const CUT_TOP = 0;                  // 上のバーを外したので、てっぺんは画面の中身
      const CUT_BOT = 36;                 // frame.txt: タブ下端 1880（40 空くが 4 残す）
      const CUT_Y = CUT_TOP + CUT_BOT;    // = 36
      function fit() {
        const s = document.getElementById('stage');
        if (!s) return;
        const dpr = window.devicePixelRatio || 1;
        // 🔴 **`floor` の直前に「ほぼ整数なら整数に寄せる」を挟む。**
        //    ⚠️ `devicePixelRatio` は 3 のつもりでも **2.9999998661** のような値を返す
        //    （実測 2026-08-25・Chrome）。素直に floor すると
        //    360x640/DPR3 で 4 が **3** に落ち、盤が 360x640 → 270x480 へ縮んで
        //    帯が 90/160 も余計に出る（本来この端末はぴったり0のはず）。
        //    ⭐ 0.1% 以内のズレは「実は整数」とみなす ── 逆に本当に 3.999 なら
        //    4 にしても実ピクセルで 0.1% 溢れるだけで、目には見えない。
        const nearInt = (v) => Math.abs(v - Math.round(v)) < 1e-3 ? Math.round(v) : Math.floor(v);
        // ⚠️ 270 = 1080/4・480 = 1920/4。⭐ 縦だけ「切ってよい量」を引いた丈で割る。
        const p = Math.max(1, nearInt(Math.min(
          innerWidth  * dpr * 4 / 1080,
          innerHeight * dpr * 4 / (1920 - CUT_Y))));
        const k = p / (4 * dpr);
        // はみ出す設計px（0〜CUT_Y）。⚠️ 横で決まったときは負になるので 0 で止める。
        const overY = Math.max(0, (1920 * p / 4 - innerHeight * dpr) * 4 / p);
        // 🔴 **切るのは下だけ**（`CUT_TOP` が 0 になったため）。⚠️ 真ん中に置くと上下へ
        //    等分に食い込むので、盤を `overY/2` ぶん下げて食い込みを全部下へ寄せる。
        //    ⚠️ ずらし量は4の倍数（＝整数ドット）に丸める ── 半端だと実ピクセルの
        //    格子から外れて、せっかくの整数倍が濁る。
        // ⭐ **切り上げる**（前は切り捨てだった）── 切り捨てると最大3px が上に残り、
        //    ホームの EXP の字（`home.txt` の `count` が y=0）を削る。多めに下げても
        //    下の食い込みは overY（≤ CUT_BOT）を超えないので、タブには届かない。
        const shift = Math.min(CUT_BOT, Math.ceil(overY / 2 / 4) * 4);
        // 🔴 **左上を実ピクセルの整数へ載せる。**⚠️ 窓の幅・高さが奇数だと中央が
        //    半ピクセル位置になり、整数倍なのにドットが濁る（実測 1921x951 で 825.5px）。
        s.style.transformOrigin = '0 0';
        s.style.left = Math.round((innerWidth  - 1080 * k) / 2 * dpr) / dpr + 'px';
        s.style.top  = (Math.round((innerHeight - 1920 * k) / 2 * dpr) / dpr + shift * k) + 'px';
        s.style.transform = 'scale(' + k + ')';
      }
      addEventListener('resize', fit);
      new MutationObserver(fit).observe(document.documentElement, {childList: true, subtree: true});
      // ⚠️ **`devicePixelRatio` は変わりうる**（別ディスプレイへ移す・ブラウザのズーム）。
      //    ⭐ `resize` だけでは拾えないことがあるので、`matchMedia('(resolution: …)')` で
      //    現在の DPR を監視し、外れたら fit() をやり直して監視し直す（単純に保つ）。
      function watchDpr() {
        const q = matchMedia('(resolution: ' + devicePixelRatio + 'dppx)');
        q.addEventListener('change', () => { fit(); watchDpr(); }, { once: true });
      }
      watchDpr();
      fit();
    </script>
</body>

</html>
